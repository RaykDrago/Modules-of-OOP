<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">О нас</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <img th:src="@{/images/logo.jpg}" style="width: 5vw; height: auto;" class="me-2"/>
            Help Desk
        </a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Главная</a>
            <a class="nav-link" th:href="@{/about}">О нас</a>
            <a class="nav-link" th:href="@{/contacts}">Контакты</a>
            <a class="nav-link active" th:href="@{/faq}">База ютуберов и данных</a>
            <a class="nav-link" href="/tickets">Заявки</a>
            <a class="nav-link" th:href="@{/tickets/new}">Создание заявки</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <h1 class="fw-bold mb-4" th:text="${pageTitle}">
        Список лучших ютуберов
    </h1>

    <h2 class="fw-bold mb-4" th:text="${miniTitle}">
        Часто задаваемые вопросы
    </h2>

    <div th:each="question : ${theoftenQuestions}">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h2 class="h5" th:text="${question}">Функция</h2>
                <p class="card-text text-muted">
                    Частый вопрос
                </p>
            </div>
        </div>
    </div>

    <a class="btn btn-primary btn-lg" th:href="@{/}">
        Вернуться на главную
    </a>
</main>
</body>
</html>
