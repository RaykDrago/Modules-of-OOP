<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ-панель | Help Desk</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">
            <img th:src="@{/images/admin.gif}" style="width: 5vw; height: auto;" class="me-2"/>
            Help Desk ADMIN
        </a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/admin}">Главная</a>
            <a class="nav-link" th:href="@{/about}">О нас</a>
            <a class="nav-link" th:href="@{/contacts}">Контакты</a>
            <a class="nav-link" th:href="@{/faq}">База ютуберов и данных</a>
            <!-- <a class="nav-link" href="/tickets">Заявки</a> -->
            <a class="nav-link" th:href="@{/tickets/new}">Создание заявки</a>
            <a class="nav-link active" th:href="@{/admin/tickets}">Админ-панель</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit" class="btn btn-warning">
                    Выйти
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row align-items-center g-4 mb-4">
        <div class="col-lg-7">
            <h1 class="fw-bold" th:text="${pageTitle}">Список заявок</h1>
            <p class="lead text-muted">Закрытая зона администратора</p>
        </div>
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5">Всего заявок</h2>
                    <p class="mb-0 fs-3 fw-bold" th:text="${#lists.size(tickets)} + ' заявок'">0 заявок</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mb-4">
        <a class="btn btn-dark btn-lg" th:href="@{/}">
            Вернуться на главную
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Тема</th>
                        <th>Описание</th>
                        <th>Статус</th>
                        <th>Дата создания</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td th:text="${ticket.id}">1</td>
                        <td th:text="${ticket.customerName}">Иван</td>
                        <td th:text="${ticket.title}">Не работает ПК</td>
                        <td th:text="${ticket.description}">Описание</td>
                        <td>
                            <span class="badge text-bg-info"
                                  th:text="${ticket.status}">NEW</span>
                        </td>
                        <td th:text="${#temporals.format(ticket.createdAt,
                                'dd.MM.yyyy HH:mm')}">
                            01.01.2026 10:00
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
